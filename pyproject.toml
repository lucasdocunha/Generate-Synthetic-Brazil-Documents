[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brazilfiscalreport*", "generator*"]

[tool.setuptools.package-data]
"brazilfiscalreport.danfse" = ["*.png", "*.csv"]

[project]
name = "brazilfiscalreport"
dynamic = ["version"]
description = "Synthetic-data generator backend for Brazilian auxiliary fiscal documents (DANFE, DACTE, DAMDFE, DANFSE, DACCe), forked from BrazilFiscalReport."
authors = [{ name = "Lucas" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.3",
    "phonenumbers",
    "python-barcode",
    "qrcode",
    "Faker",
    "PyYAML",
    "PyMuPDF",
    "albumentations",
    "pyarrow",
    "joblib",
    "typer",
    "pydantic",
    "Pillow",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.dynamic]
version = {attr = "brazilfiscalreport.__version__"}

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-comprehensions
    "C4",
    # isort
    "I",
]

isort = { known-first-party = ['brazilfiscalreport', 'test'] }

[tool.doc8]
max-line-length = 88
