[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "renderers*", "generator*", "augmentation*", "pipeline*",
    "export*", "validation*", "rasterization*", "htmlgen*",
]

[tool.setuptools.package-data]
"renderers.danfse" = ["*.png", "*.csv"]
"htmlgen" = ["templates/*.j2"]
"generator" = ["templates/**/*.xml", "templates/**/*.yaml", "schemas/*.yaml"]

[project]
name = "generate-synthetic-brazil-documents"
version = "0.1.0"
description = "Gerador de datasets sintéticos de documentos fiscais brasileiros (DANFE, DACTE, DAMDFE, DANFSE, DACCe, Portal NF-e) com XML, PDF, imagens degradadas, HTML/Markdown e anotações. Renderizadores PDF derivados de BrazilFiscalReport (LGPL-3.0), ver renderers/NOTICE.md."
authors = [{ name = "Lucas" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.3",
    "phonenumbers",
    "python-barcode",
    "qrcode",
    "Faker",
    "PyYAML",
    "PyMuPDF",
    "albumentations",
    "pyarrow",
    "joblib",
    "typer",
    "pydantic",
    "Pillow",
    "nfselib-legacy>=1.0.0",
    "Jinja2",
    "lxml",
    "playwright",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-comprehensions
    "C4",
    # isort
    "I",
]

isort = { known-first-party = ['renderers', 'generator', 'augmentation', 'pipeline', 'export', 'validation', 'rasterization', 'htmlgen'] }

[tool.doc8]
max-line-length = 88
